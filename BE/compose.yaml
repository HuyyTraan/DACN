name: dacn
services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: omni
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omni_local_dev}
            POSTGRES_DB: omni
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U omni -d omni']
            interval: 5s
            timeout: 5s
            retries: 10
    n8n:
        image: docker.n8n.io/n8nio/n8n:latest
        ports:
            - '127.0.0.1:5678:5678'
        environment:
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: 5432
            DB_POSTGRESDB_DATABASE: n8n
            DB_POSTGRESDB_USER: omni
            DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-omni_local_dev}
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
            GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
            TZ: Asia/Ho_Chi_Minh
            N8N_SECURE_COOKIE: 'false'
        volumes:
            - n8n_data:/home/node/.n8n
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    postgres_data:
    n8n_data:
